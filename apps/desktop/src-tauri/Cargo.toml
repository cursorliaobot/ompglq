[package]
name = "omp-manager"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "omp-manager"

[lib]
name = "omp_manager_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "omp-manager"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = []
desktop = [
    "dep:tauri",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-single-instance",
]

[[test]]
name = "omp_probe_stub"
path = "tests/omp_probe_stub.rs"
harness = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
libc = "0.2.189"
portable-pty = "0.9"
regex = "1"
rusqlite = { version = "0.32.1", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = { version = "2.7.2", optional = true }
tauri-plugin-single-instance = { version = "2.4.3", optional = true }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "time"] }
uuid = { version = "1.26.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_DataExchange", "Win32_UI_WindowsAndMessaging", "Win32_Security"] }
